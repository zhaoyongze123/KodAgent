version: "0.5"

# KodAgent 本地开发进程面板。
# PostgreSQL、Redis 等中间件继续由 Docker Compose 管理，不在这里重复接管。
# 所有应用进程统一由 process-compose 管理；Raycast 脚本只调用 process-compose。
processes:
  java-backend:
    command: >-
      bash -lc '
      ./scripts/stop-java-backends.sh || exit $?;
      if [ -f script/docker/env/dev.env ]; then
        set -a; source script/docker/env/dev.env; set +a;
      fi;
      export AGENT_EVENT_POSTGRES_URL="jdbc:postgresql://127.0.0.1:${LANGGRAPH_POSTGRES_PORT:-15432}/langgraph?sslmode=disable";
      export SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-local}";
      ./scripts/migrate-agent-event-schema.sh || exit $?;
      if [ ! -f yudao-server/target/yudao-server.jar ]; then
        mvn -pl yudao-server -am -DskipTests package || exit $?;
      fi;
      exec java -jar yudao-server/target/yudao-server.jar'
    working_dir: /Users/mac/项目/kodagent

  agent-ui:
    command: >-
      bash -lc '
      exec /Users/mac/项目/kodagent/scripts/start-agent-ui.sh'
    working_dir: /Users/mac/项目/kodagent/agent-chat-ui
    depends_on:
      java-backend:
        condition: process_started

  oa-ui:
    command: >-
      bash -lc '
      export NODE_OPTIONS="--max-old-space-size=4096${NODE_OPTIONS:+ $NODE_OPTIONS}";
      exec pnpm --filter @vben/web-antd exec vite --mode development --port 5666'
    working_dir: /Users/mac/项目/kodagent/yudao-ui/yudao-ui-admin-vben-temp

  langgraph:
    command: >-
      bash -lc '
      trap "docker compose -f docker-compose.dev.yml down" EXIT INT TERM;
      docker compose -f docker-compose.dev.yml up --no-color langgraph-api'
    working_dir: /Users/mac/项目/kodagent/agent-python
    depends_on:
      model-lan-relay:
        condition: process_started

  model-lan-relay:
    command: >-
      bash -lc '
      exec /Users/mac/项目/kodagent/scripts/start-model-lan-relay.sh'
    working_dir: /Users/mac/项目/kodagent
