[project]
name = "kodagent-deepagents-demo"
version = "0.1.0"
description = "DeepAgents console prototype for KodAgent"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.0",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-redis>=0.5.1",
    "redis>=5.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.scripts]
oa-agent-console = "src.oa_agent_console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
