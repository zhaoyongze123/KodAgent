name: yudao-system

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8
    container_name: ruoyi-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro

  redis:
    image: docker.m.daocloud.io/library/redis:6-alpine
    container_name: ruoyi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

  langgraph-postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: kodagent-langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LANGGRAPH_POSTGRES_DB:-langgraph}
      POSTGRES_USER: ${LANGGRAPH_POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:?LANGGRAPH_POSTGRES_PASSWORD must be set}
      TZ: Asia/Shanghai
    ports:
      - "${LANGGRAPH_POSTGRES_PORT:-15432}:5432"
    volumes:
      - langgraph-postgres-data:/var/lib/postgresql/data

  # OA MySQL schema is owned by Java/OA and is applied by one canonical job.
  # The immutable base dump only creates the base application schema.
  oa-mysql-schema-migrate:
    image: docker.m.daocloud.io/library/mysql:8
    restart: "no"
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - ${OA_PERSONAL_SCHEDULE_SCHEMA_SQL_HOST_PATH:-../../sql/mysql/system-personal-schedule-init.sql}:/migrations/system-personal-schedule-init.sql:ro
      - ${OA_PERSONAL_SCHEDULE_EFFECT_SCHEMA_SQL_HOST_PATH:-../../sql/mysql/agent_personal_schedule_effect.sql}:/migrations/agent_personal_schedule_effect.sql:ro
      - ${OA_PARTY_FILE_SCHEMA_SQL_HOST_PATH:-../../sql/mysql/party-file-kod-schema-v2.sql}:/migrations/party-file-kod-schema-v2.sql:ro
    command: >-
      sh -ec 'for attempt in $$(seq 1 60); do
      mysqladmin ping -h"$$MYSQL_HOST" -u"$$MYSQL_USER" --silent >/dev/null 2>&1 && break;
      test "$$attempt" -eq 60 && exit 1; sleep 2; done;
      for migration in /migrations/system-personal-schedule-init.sql
      /migrations/agent_personal_schedule_effect.sql
      /migrations/party-file-kod-schema-v2.sql; do
      mysql --default-character-set=utf8mb4 -h"$$MYSQL_HOST" -u"$$MYSQL_USER"
      "$$MYSQL_DATABASE" < "$$migration"; done'

  # Schema is applied outside the Java runtime. It is safe to run repeatedly:
  # the canonical SQL is idempotent and records its applied Agent versions.
  agent-event-schema-migrate:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: "no"
    depends_on:
      - langgraph-postgres
    environment:
      PGHOST: langgraph-postgres
      PGPORT: 5432
      PGDATABASE: ${LANGGRAPH_POSTGRES_DB:-langgraph}
      PGUSER: ${LANGGRAPH_POSTGRES_USER:-langgraph}
      PGPASSWORD: ${LANGGRAPH_POSTGRES_PASSWORD:?LANGGRAPH_POSTGRES_PASSWORD must be set}
    volumes:
      - ${AGENT_EVENT_SCHEMA_SQL_HOST_PATH:-../../sql/postgresql/agent_run_event.sql}:/migrations/agent_run_event.sql:ro
      - ${AGENT_RUNTIME_SCHEMA_SQL_HOST_PATH:-../../sql/postgresql/agent_runtime.sql}:/migrations/agent_runtime.sql:ro
      - ${AGENT_MODEL_SCHEMA_SQL_HOST_PATH:-../../sql/postgresql/agent_model_config.sql}:/migrations/agent_model_config.sql:ro
      - ${AGENT_PARTY_KNOWLEDGE_SCHEMA_SQL_HOST_PATH:-../../sql/postgresql/party_knowledge.sql}:/migrations/party_knowledge.sql:ro
      - ${AGENT_PARTY_KNOWLEDGE_VECTOR_SCHEMA_SQL_HOST_PATH:-../../sql/postgresql/party_knowledge_vector.sql}:/migrations/party_knowledge_vector.sql:ro
    command: >-
      sh -ec 'for attempt in $$(seq 1 60); do pg_isready >/dev/null 2>&1 && break; test "$$attempt" -eq 60 && exit 1; sleep 2; done; for migration in /migrations/agent_run_event.sql /migrations/agent_runtime.sql /migrations/agent_model_config.sql /migrations/party_knowledge.sql /migrations/party_knowledge_vector.sql; do psql -v ON_ERROR_STOP=1 -f "$$migration"; done'

  server:
    build:
      context: ../..
      dockerfile: script/docker/backend.Dockerfile
    image: ruoyi-server:local
    container_name: ruoyi-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      langgraph-postgres:
        condition: service_started
      oa-mysql-schema-migrate:
        condition: service_completed_successfully
      agent-event-schema-migrate:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JAVA_OPTS: ${JAVA_OPTS:- -Xms512m -Xmx1024m -Djava.security.egd=file:/dev/./urandom}
      ARGS: >-
        --spring.datasource.dynamic.datasource.master.url=${MASTER_DATASOURCE_URL:-jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}
        --spring.datasource.dynamic.datasource.master.username=${MASTER_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.master.password=${MASTER_DATASOURCE_PASSWORD:?MASTER_DATASOURCE_PASSWORD must be set}
        --spring.datasource.dynamic.datasource.slave.url=${SLAVE_DATASOURCE_URL:-jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true}
        --spring.datasource.dynamic.datasource.slave.username=${SLAVE_DATASOURCE_USERNAME:-root}
        --spring.datasource.dynamic.datasource.slave.password=${SLAVE_DATASOURCE_PASSWORD:?SLAVE_DATASOURCE_PASSWORD must be set}
        --spring.redis.host=${REDIS_HOST:-redis}
        --yudao.agent.events.postgres.url=${AGENT_EVENT_POSTGRES_URL:?AGENT_EVENT_POSTGRES_URL must be set}
        --yudao.agent.events.postgres.username=${AGENT_EVENT_POSTGRES_USERNAME:?AGENT_EVENT_POSTGRES_USERNAME must be set}
        --yudao.agent.events.postgres.password=${AGENT_EVENT_POSTGRES_PASSWORD:?AGENT_EVENT_POSTGRES_PASSWORD must be set}
        --yudao.kod-sso.enabled=${KOD_SSO_ENABLED:-false}
        --yudao.kod-sso.base-url=${KOD_SSO_BASE_URL:-http://replace-with-kodbox-host}
        --yudao.kod-sso.app-name=${KOD_SSO_APP_NAME:-user:all}
        --yudao.kod-sso.redirect-uri=${KOD_SSO_REDIRECT_URI:-http://replace-with-frontend-host/#/auth/kod-sso-login?tenantId=1}
        --yudao.kod-sso.callback-base-url=${KOD_SSO_CALLBACK_BASE_URL:-http://replace-with-backend-host}
        --yudao.kod-sso.tenant-id=${KOD_SSO_TENANT_ID:-1}
        --yudao.kod-sso.auto-create-user=${KOD_SSO_AUTO_CREATE_USER:-false}
      OA_AGENT_API_KEY: ${OA_AGENT_API_KEY:-}
      OA_AGENT_IDENTITY_SECRET: ${OA_AGENT_IDENTITY_SECRET:-}
      OA_AGENT_LEGACY_PRINCIPAL_ENABLED: ${OA_AGENT_LEGACY_PRINCIPAL_ENABLED:-false}
      OA_AGENT_AUTH_ENABLED: ${OA_AGENT_AUTH_ENABLED:-true}
      AGENT_MODEL_ENCRYPTION_KEY: ${AGENT_MODEL_ENCRYPTION_KEY:?AGENT_MODEL_ENCRYPTION_KEY must be set}
    ports:
      - "${SERVER_PORT:-48080}:48080"

  admin:
    build:
      context: ../..
      dockerfile: script/docker/frontend.Dockerfile
      args:
        FRONTEND_ENV_FILE: ${FRONTEND_ENV_FILE:-script/docker/frontend.env.production}
    image: ruoyi-admin:local
    container_name: ruoyi-admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${ADMIN_PORT:-18080}:80"

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-yudao-system_mysql}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-yudao-system_redis}
  langgraph-postgres-data:
    name: ${LANGGRAPH_POSTGRES_VOLUME_NAME:-kodagent_langgraph_postgres}
