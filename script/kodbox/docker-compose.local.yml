name: kodagent-kodbox-local

services:
  kodbox:
    image: kodcloud/kodbox:latest
    container_name: kodagent-kodbox
    restart: unless-stopped
    ports:
      - "${KODBOX_PORT:-8001}:80"
    volumes:
      - kodbox-data:/var/www/html
      # KodBox 首次启动会同步插件目录并修正属主，本地开发挂载必须可写。
      - ./plugins:/var/www/html/plugins
    environment:
      TZ: Asia/Shanghai

volumes:
  kodbox-data:
    name: ${KODBOX_VOLUME_NAME:-kodagent_kodbox_data}
